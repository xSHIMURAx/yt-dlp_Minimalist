<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ajustes — YT-DLP Minimalist</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: #0d0d0d;
      color: #e6e6e6;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      max-width: 480px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px;
      color: #f5f5f5;
    }
    p.subtitle {
      font-size: 13px;
      color: #a0a0a0;
      margin: 0 0 22px;
    }
    fieldset {
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 6px;
      margin: 0;
    }
    legend {
      font-size: 12px;
      color: #a0a0a0;
      padding: 0 6px;
    }
    label.option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    label.option:hover {
      background: #171717;
    }
    label.option input {
      accent-color: #f5f5f5;
      width: 16px;
      height: 16px;
    }
    .option-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .option-title {
      font-size: 13px;
      font-weight: 600;
    }
    .option-desc {
      font-size: 12px;
      color: #999;
    }
    #saved {
      margin-top: 14px;
      font-size: 12px;
      color: #f5f5f5;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #saved.show {
      opacity: 1;
    }
    #sync-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #d0a24c;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #sync-hint.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>YT-DLP Minimalist</h1>
  <p class="subtitle" data-i18n="options_subtitle">Elegí cómo se ve el botón flotante que aparece sobre los videos.</p>

  <fieldset>
    <legend data-i18n="settings_overlay_legend">Botón flotante</legend>
    <label class="option">
      <input type="radio" name="mode" value="icon" />
      <span class="option-text">
        <span class="option-title" data-i18n="overlay_icon_title">Solo ícono (compacto)</span>
        <span class="option-desc" data-i18n="overlay_icon_desc">50×20px, pegado a la esquina del video.</span>
      </span>
    </label>
    <label class="option">
      <input type="radio" name="mode" value="text" />
      <span class="option-text">
        <span class="option-title" data-i18n="overlay_text_title">Ícono + texto "Descargar"</span>
        <span class="option-desc" data-i18n="overlay_text_desc">Más visible, con el texto al lado del ícono.</span>
      </span>
    </label>
  </fieldset>

  <fieldset style="margin-top: 14px;">
    <legend data-i18n="settings_downloads_legend">Descargas desde la extensión</legend>
    <label class="option">
      <input type="checkbox" id="keep-in-background" />
      <span class="option-text">
        <span class="option-title" data-i18n="keep_app_in_background_title">Mantener la app en segundo plano</span>
        <span class="option-desc" data-i18n="keep_app_in_background_desc">Si ya elegiste la calidad acá (popup o botón flotante), la descarga arranca sin traer la ventana de la app al frente. Es el mismo ajuste que hay en la app (Configuración → General): cambiarlo de cualquiera de los dos lados actualiza el otro.</span>
      </span>
    </label>
  </fieldset>

  <fieldset style="margin-top: 14px;">
    <legend data-i18n="settings_language_legend">Idioma</legend>
    <label class="option">
      <input type="radio" name="language" value="es" />
      <span class="option-text">
        <span class="option-title" data-i18n="language_es">Español</span>
      </span>
    </label>
    <label class="option">
      <input type="radio" name="language" value="en" />
      <span class="option-text">
        <span class="option-title" data-i18n="language_en">English</span>
      </span>
    </label>
  </fieldset>

  <div id="saved" data-i18n="saved_label">Guardado ✓</div>
  <div id="sync-hint" data-i18n="sync_hint">No se pudo sincronizar con la app — abrila para que este ajuste quede igual en los dos lados.</div>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
