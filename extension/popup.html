<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>YT-DLP Minimalist</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      background: #0d0d0d;
      color: #e6e6e6;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 10px;
      color: #f5f5f5;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #pageTitle {
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 14px;
      max-height: 40px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #f5f5f5;
      color: #0d0d0d;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #3a3a3a;
      color: #888;
      cursor: default;
    }
    button:hover:not(:disabled) {
      background: #ffffff;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }
    #status.error { color: #ff8080; }
    #status.success { color: #f5f5f5; }
    #optionsLink {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 12px;
      font-size: 11px;
      color: #6b6b6b;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
      padding: 4px;
    }
    #optionsLink:hover { color: #a0a0a0; }
    #optionsLink .chevron {
      display: inline-block;
      transition: transform 0.15s ease;
      font-size: 9px;
    }
    #optionsLink[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }
    #settingsPanel {
      display: none;
      margin-top: 10px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
    }
    #settingsPanel.open {
      display: block;
    }
    #settingsPanel .setting-title {
      font-size: 11px;
      color: #a0a0a0;
      padding: 8px 10px 4px;
    }
    label.option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }
    label.option:hover {
      background: #171717;
    }
    label.option input {
      accent-color: #f5f5f5;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .option-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .option-title {
      font-size: 12px;
      font-weight: 600;
    }
    .option-desc {
      font-size: 10.5px;
      color: #888;
    }
    #saved {
      font-size: 10.5px;
      color: #f5f5f5;
      text-align: center;
      padding: 4px 0 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #saved.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>YT-DLP Minimalist</h1>
  <div id="pageTitle">Cargando pestaña…</div>
  <button id="sendBtn">Enviar a YT-DLP Minimalist</button>
  <div id="status"></div>
  <button id="optionsLink" aria-expanded="false">
    <span>Ajustes del botón flotante</span>
    <span class="chevron">▾</span>
  </button>
  <div id="settingsPanel">
    <div class="setting-title">Botón flotante</div>
    <label class="option">
      <input type="radio" name="mode" value="icon" />
      <span class="option-text">
        <span class="option-title">Solo ícono (compacto)</span>
        <span class="option-desc">50×20px, pegado a la esquina del video.</span>
      </span>
    </label>
    <label class="option">
      <input type="radio" name="mode" value="text" />
      <span class="option-text">
        <span class="option-title">Ícono + texto "Descargar"</span>
        <span class="option-desc">Más visible, con el texto al lado del ícono.</span>
      </span>
    </label>
    <div id="saved">Guardado ✓</div>
  </div>
  <script src="url-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
