<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Historial — YT-DLP Minimalist</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 14px;
      background: #0d0d0d;
      color: #e6e6e6;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      color: #f5f5f5;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #clearBtn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #a0a0a0;
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
    }
    #clearBtn:hover {
      color: #ff8080;
      border-color: #ff8080;
    }
    #clearBtn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #empty {
      color: #6b6b6b;
      font-size: 12px;
      text-align: center;
      padding: 40px 10px;
      display: none;
    }
    ul#list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    li.entry {
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 9px 10px;
    }
    .entry-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #f0f0f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .entry-url {
      font-size: 11px;
      color: #808080;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }
    .entry-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }
    .entry-time {
      font-size: 10.5px;
      color: #6b6b6b;
    }
    .entry-status {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .entry-status.sent {
      background: rgba(120, 220, 150, 0.12);
      color: #7ee0a0;
    }
    .entry-status.protocol {
      background: rgba(240, 190, 90, 0.12);
      color: #f0be5a;
    }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="tab_history">Historial</h1>
    <button id="clearBtn" data-i18n="clear_btn">Borrar</button>
  </header>
  <div id="empty" data-i18n="history_empty">Todavía no enviaste ningún video.</div>
  <ul id="list"></ul>
  <script src="i18n.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
